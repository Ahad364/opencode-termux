name: Coding Keys Build

# Builds the Coding Keys project (nested in this repository).
# The same workflow exists inside CodingKeys/ for use if the project is
# ever moved to its own repository.

on:
  push:
    branches: [main, master]
    paths:
      - "CodingKeys/**"
      - ".github/workflows/coding-keys-build.yml"
  pull_request:
    paths:
      - "CodingKeys/**"
  workflow_dispatch:

jobs:
  build:
    name: Test, build and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodingKeys

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Clean, run unit tests and build debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --stacktrace

      - name: Run lint
        run: ./gradlew lint

      # Release signing is optional. To enable it, create a repository
      # variable SIGNING_ENABLED=true and secrets KEYSTORE_BASE64 (base64 of
      # a .jks keystore), KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEY_PASSWORD.
      - name: Prepare release signing (optional)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/CodingKeys/release-keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/CodingKeys/release-keystore.jks"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodingKeys-debug-apk
          path: CodingKeys/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodingKeys-release-apk
          path: CodingKeys/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        uses: actions/upload-artifact@v4
        with:
          name: CodingKeys-build-reports
          path: |
            CodingKeys/app/build/reports/lint-results*.html
            CodingKeys/app/build/reports/tests/**
          if-no-files-found: warn
