plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codingkeys.keyboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.codingkeys.keyboard"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    // Release signing is applied only when the CI environment provides a keystore.
    // See .github/workflows/android.yml (Release signing section in README).
    signingConfigs {
        ciRelease {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEYSTORE_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.ciRelease.storeFile != null) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // kotlin-stdlib 1.8.20+ merged the jdk7/jdk8 variants; without these
    // constraints, transitive 1.6.x artifacts cause duplicate-class errors.
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because "kotlin-stdlib 1.8.22 includes the jdk7 classes"
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because "kotlin-stdlib 1.8.22 includes the jdk8 classes"
        }
    }

    testImplementation 'junit:junit:4.13.2'
}
