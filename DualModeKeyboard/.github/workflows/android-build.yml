name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test, lint and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Release signing is optional. To enable it, create a repository
      # variable SIGNING_ENABLED=true and secrets KEYSTORE_BASE64 (base64 of
      # a .jks keystore), KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEY_PASSWORD.
      # Without them, assembleRelease produces an UNSIGNED release APK.
      - name: Prepare release signing (optional)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build release App Bundle (AAB)
        run: ./gradlew bundleRelease

      - name: Package complete source ZIP
        run: bash scripts/package-source.sh

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualModeKeyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualModeKeyboard-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualModeKeyboard-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload source ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualModeKeyboard-Source
          path: DualModeKeyboard-Source.zip
          if-no-files-found: error

      - name: Upload lint and test reports
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/tests/**
          if-no-files-found: warn
